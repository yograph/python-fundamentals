name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-uploaded Pages artifact is worse than
# a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bad data must never ship, even though CI already checked it: a manual
      # dispatch can run on a ref CI never saw.
      - name: Validate data
        run: pnpm data:validate

      # Produces frontend/dist, including a copy of data/, 404.html, .nojekyll
      # (postbuild.mjs) and everything in frontend/public (Vite).
      #
      # VITE_BASE_PATH comes from the Pages config itself: "" for a custom
      # domain or user site (so the base stays "/", as before), "/<repo>" for a
      # project page — which is what a fork without the custom domain gets.
      # Without it a project-page deploy requests /assets/* at the domain root
      # and renders a blank page.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
